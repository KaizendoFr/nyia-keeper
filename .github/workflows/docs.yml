# Docs site DEPLOY workflow — install this ONCE on the PUBLIC repo (KaizendoFr/nyia-keeper)
# as .github/workflows/docs.yml. It cannot be synced automatically: sync-public preserves
# the public repo's .github and never overwrites it from dist/runtime. (Plan 285)
#
# One-time setup on the public repo:
#   1. Copy this file to .github/workflows/docs.yml in KaizendoFr/nyia-keeper.
#   2. Settings -> Pages -> Source = "GitHub Actions".
# The site then publishes at https://kaizendofr.github.io/nyia-keeper/ and rebuilds whenever
# the release pipeline syncs new docs/ + mkdocs.yml into the public repo (or on dispatch).
name: Docs Site

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install docs deps (pinned)
        run: pip install -r docs/requirements.txt
      - uses: actions/configure-pages@v5
      - name: Build site (strict)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
